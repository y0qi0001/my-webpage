<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#355d3c">
<title>家庭共享菜谱</title>
<style>
:root {
  --bg:#f4f2ed; --paper:#fffdf9; --ink:#26231f; --muted:#777168;
  --line:#e3ddd2; --green:#355d3c; --green2:#e7efe7;
  --warm:#b8663f; --warm2:#fff4ed; --blue:#46667a; --blue2:#eef4f7;
  --shadow:0 8px 26px rgba(34,30,25,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit} button{touch-action:manipulation}
.hidden{display:none!important}
.app{max-width:1500px;margin:0 auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
h1{margin:0;font-size:27px;line-height:1.2}
.subtitle{color:var(--muted);font-size:13px;margin-top:5px}
.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 11px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn:hover{filter:brightness(.98)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa} .dot.ok{background:#2d8a4f} .dot.busy{background:#d59634} .dot.err{background:#b84b42}
.grid{display:grid;grid-template-columns:minmax(700px,1.45fr) minmax(370px,.8fr);gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-head{padding:15px 16px 8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card-head h2{font-size:18px;margin:0}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:8px 12px 14px}
.day{background:#fff;border:1px solid var(--line);border-radius:13px;min-height:265px;padding:9px;display:flex;flex-direction:column;gap:7px;transition:.15s}
.day.today{box-shadow:inset 0 0 0 2px var(--green)} .day.dragover{outline:2px solid var(--warm);background:var(--warm2)}
.day-head{display:flex;justify-content:space-between;align-items:flex-start}
.day-meta{display:flex;flex-direction:column;gap:2px} .day-name{font-weight:800;cursor:pointer} .day-date{font-size:11px;color:var(--muted)}
.today-badge{display:inline-block;background:var(--green);color:#fff;border-radius:999px;padding:2px 6px;font-size:10px;margin-left:4px}
.day-count{font-size:11px;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:7px;min-height:170px}
.item{position:relative;border:1px solid var(--line);border-radius:9px;padding:9px 27px 9px 9px;font-size:12px;line-height:1.3;background:#faf8f4;cursor:grab}
.item.main{border-left:4px solid var(--warm)} .item.side{border-left:4px solid var(--green)} .item.soup{border-left:4px solid var(--blue)}
.x{position:absolute;right:4px;top:4px;width:21px;height:21px;border:0;background:transparent;color:#aaa;cursor:pointer;padding:0}
.mobile-day-tabs{display:none}
.library-wrap{padding:0 12px 14px}
.search-row{display:flex;gap:7px;margin-bottom:10px} .search-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lib-block{margin:11px 0 15px} .lib-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px} .lib-title b{font-size:14px} .lib-title span{font-size:11px;color:var(--muted)}
.dish-bank{display:flex;flex-wrap:wrap;gap:6px}
.dish-chip{border:1px solid var(--line);border-radius:999px;padding:0;background:#fff;font-size:12px;cursor:grab;user-select:none;display:inline-flex;align-items:center;overflow:hidden}
.dish-chip-label{padding:7px 8px 7px 10px}
.dish-delete{display:none;border:0;border-left:1px solid rgba(0,0,0,.08);background:transparent;color:#aaa;padding:7px 8px;cursor:pointer;line-height:1}
body.edit-library .dish-delete{display:inline-block}
.dish-chip.main{border-color:#ddbaa9;background:#fff9f6} .dish-chip.side{border-color:#bdd0c0;background:#f8fcf8} .dish-chip.soup{border-color:#bdd0d9;background:#f6fbfd}
.add{display:none;border-top:1px solid var(--line);padding:12px} body.edit-library .add{display:block}
.add-grid{display:grid;grid-template-columns:1.1fr .7fr 1.7fr auto;gap:7px} .add-grid input,.add-grid select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff}
.bottom{margin-top:14px} .scope{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 10px} .scope .btn.active{background:var(--green);border-color:var(--green);color:#fff}
.ing-area{display:grid;grid-template-columns:1fr auto;gap:12px;padding:0 14px 15px}
.ing-groups{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ing-group{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;min-height:120px}
.ing-group-title{font-weight:800;font-size:13px;margin-bottom:9px} .ing-list{display:flex;gap:7px;flex-wrap:wrap;align-content:flex-start}
.ing{background:var(--green2);border-radius:999px;padding:7px 9px;font-size:12px} .ing.aux{background:#f1eee7}
.ing-actions{display:flex;flex-direction:column;gap:7px;min-width:135px}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-card{width:min(460px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px}
.login-card h1{margin-bottom:8px} .login-card p{color:var(--muted);font-size:13px;line-height:1.55}
.login-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;margin:6px 0}
.login-actions{display:flex;gap:8px;margin-top:10px} .login-actions button{flex:1}
.login-error{color:#a33;font-size:12px;margin-top:8px;min-height:18px}
.setup-note{margin-top:14px;padding:11px;border-radius:12px;background:#fff8df;font-size:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#25231f;color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100} .toast.show{opacity:1}
@media(max-width:1120px){.grid{grid-template-columns:1fr} .week{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){
  body{background:var(--paper)} .app{padding:10px 10px calc(24px + env(safe-area-inset-bottom))}
  .top{flex-direction:column;gap:10px} h1{font-size:24px} .top-actions{justify-content:flex-start}
  .grid{display:block} .card{box-shadow:none;border-radius:15px} .menu-card{margin-bottom:12px}
  .mobile-day-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none} .mobile-day-tabs::-webkit-scrollbar{display:none} .mobile-day-tabs button{white-space:nowrap} .mobile-day-tabs button.today-tab{box-shadow:inset 0 0 0 2px var(--green)}
  .week{display:block;padding:0 12px 12px} .day{display:none;min-height:220px} .day.active-day{display:flex}
  .item{font-size:14px;padding:11px 32px 11px 11px} .dish-chip{font-size:13px;cursor:pointer} .dish-chip-label{padding:9px 9px 9px 11px} .dish-delete{padding:9px 10px}
  .add-grid{grid-template-columns:1fr 1fr} .add-grid input:nth-child(3){grid-column:1/-1} .add-grid button{grid-column:1/-1}
  .scope{overflow-x:auto;flex-wrap:nowrap} .scope .btn{white-space:nowrap} .ing-area{grid-template-columns:1fr;padding:0 12px 13px} .ing-groups{grid-template-columns:1fr} .ing-actions{display:grid;grid-template-columns:1fr 1fr;min-width:0}
}
</style>
</head>

    <h1>家庭共享菜谱</h1>
    <p>全家共用一个登录账号。电脑和手机登录后，会实时看到同一份菜库和周菜单。</p>
    <input id="email" type="email" placeholder="家庭共用邮箱">

    <div class="login-actions">
      <button class="btn primary" id="loginBtn">登录</button>
    </div>
    <div id="loginError" class="login-error"></div>
    <div id="setupNote" class="setup-note hidden">

    </div>
  </div>
</section>

<div id="app" class="app hidden">
  <header class="top">
    <div>
      <h1>家庭共享菜谱</h1>

  </header>

  <main class="grid">
    <section class="card menu-card">
      <div class="card-head">
        <div>

        </div>
      </div>
      <div class="mobile-day-tabs" id="mobileTabs"></div>
      <div class="week" id="week"></div>
    </section>

    <aside class="card">
      <div class="card-head">
        <div>
          <h2>菜库</h2>

        </div>
        <button class="btn" id="toggleEditLibrary">开始编辑菜库</button>
      </div>
      <div class="library-wrap">

        <div class="lib-block"><div class="lib-title"><b>主菜</b><span id="mainCount"></span></div><div class="dish-bank" id="mainBank"></div></div>
        <div class="lib-block"><div class="lib-title"><b>配菜</b><span id="sideCount"></span></div><div class="dish-bank" id="sideBank"></div></div>
        <div class="lib-block"><div class="lib-title"><b>汤 / 炖菜</b><span id="soupCount"></span></div><div class="dish-bank" id="soupBank"></div></div>
      </div>
      <div class="add">

        <div class="add-grid">

          <select id="newType"><option>主菜</option><option>配菜</option><option>汤/炖菜</option></select>
          <input id="newIngredients" placeholder="原料，用逗号分隔">
          <button class="btn" id="addDish">加入菜库</button>
        </div>
      </div>
    </aside>
  </main>

  <section class="card bottom">
    <div class="card-head"><div><h2>采购清单</h2><div class="hint">按某一天或全周汇总。</div></div></div>
    <div class="scope" id="scope"></div>
    <div class="ing-area">
      <div class="ing-groups">
        <section class="ing-group"><div class="ing-group-title">荤菜原料</div><div class="ing-list" id="proteinIngredientList"></div></section>
        <section class="ing-group"><div class="ing-group-title">蔬菜 / 豆制品</div><div class="ing-list" id="vegIngredientList"></div></section>
        <section class="ing-group"><div class="ing-group-title">辅料</div><div class="ing-list" id="auxIngredientList"></div></section>
      </div>
      <div class="ing-actions">
        <button class="btn primary" id="copyIngredients">复制采购清单</button>
        <button class="btn" id="copyMenu">复制菜单</button>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

const DEFAULT_MENU={"周一":["葱烤大排","香菇青菜","番茄炒蛋"],"周二":["清蒸鲈鱼","家常香菇烧豆腐","西葫芦炒鸡蛋"],"周三":["香菇焖鸡","西兰花炒蘑菇","丝瓜炒毛豆"],"周四":["青椒牛肉丝","白菜烧豆腐","炒包菜丝"],"周五":["番茄虾仁","胡萝卜炒木耳","冬瓜排骨汤"],"周六":[],"周日":[]};
const DAYS=["周一","周二","周三","周四","周五","周六","周日"];
const AUXILIARY_INGREDIENTS=new Set(["葱","姜","蒜","生抽","老抽","蚝油","料酒","糖","盐","淀粉","蒸鱼豉油","醋","辣椒"]);
const PROTEIN_INGREDIENTS=new Set(["猪大排","梅花肉","猪肉丝","猪肉片","猪肉末","猪肉","猪小排","排骨","牛腩","牛肉","牛肉丝","鸡翅","鸡肉","鸡块","鸡胸肉","鲈鱼","黄鱼","黑鱼片","鱼","虾仁","鸡蛋"]);

let dishes=structuredClone(DEFAULT_DISHES);
let menu=structuredClone(DEFAULT_MENU);
let deletedDishes=new Set();
let activeDay=getTodayDayName();
let scope="全周";
let dragPayload=null;
let currentUser=null;
let stateRef=null;
let unsubscribe=null;
let libraryEditMode=false;
let suppressCloudWrite=false;

const configured=!Object.values(firebaseConfig).some(v=>v.startsWith("PASTE_"));
let appFirebase=null, auth=null, db=null;
if(configured){
  appFirebase=initializeApp(firebaseConfig);
  auth=getAuth(appFirebase);
  db=getFirestore(appFirebase);
  await setPersistence(auth,browserLocalPersistence);
} else {
  document.getElementById("setupNote").classList.remove("hidden");
}

function getTodayDayName(){
  const map={1:"周一",2:"周二",3:"周三",4:"周四",5:"周五",6:"周六",0:"周日"};
  return map[new Date().getDay()];
}
function getCurrentWeekDates(){
  const now=new Date(), day=now.getDay(), offset=day===0?-6:1-day;
  const monday=new Date(now); monday.setHours(12,0,0,0); monday.setDate(now.getDate()+offset);
  const r={}; DAYS.forEach((n,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);r[n]=d}); return r;
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function cls(type){return type==="配菜"?"side":type==="汤/炖菜"?"soup":"main"}
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove("show"),1500)}
function syncStatus(kind,text){const d=document.getElementById("syncDot");d.className="dot "+kind;document.getElementById("syncText").textContent=text}

async function saveCloud(){
  if(!stateRef||suppressCloudWrite)return;
  try{
    syncStatus("busy","同步中");
    await setDoc(stateRef,{
      dishes,
      menu,
      deletedDishes:[...deletedDishes],
      updatedAt:serverTimestamp()
    },{merge:true});
    syncStatus("ok","已同步");
  }catch(e){console.error(e);syncStatus("err","同步失败")}
}

async function startCloudSync(user){
  currentUser=user;
  stateRef=doc(db,"users",user.uid,"shared","familyMenu");
  const snap=await getDoc(stateRef);
  if(!snap.exists()){
    await setDoc(stateRef,{dishes:DEFAULT_DISHES,menu:DEFAULT_MENU,deletedDishes:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  }
  if(unsubscribe)unsubscribe();
  unsubscribe=onSnapshot(stateRef,snap=>{
    if(!snap.exists())return;
    const data=snap.data();
    suppressCloudWrite=true;
    dishes={...structuredClone(DEFAULT_DISHES),...(data.dishes||{})};
    deletedDishes=new Set(data.deletedDishes||[]);
    deletedDishes.forEach(n=>delete dishes[n]);
    menu=data.menu||structuredClone(DEFAULT_MENU);
    DAYS.forEach(d=>{if(!Array.isArray(menu[d]))menu[d]=[]});
    renderAll();
    suppressCloudWrite=false;
    syncStatus("ok","已同步");
  },e=>{console.error(e);syncStatus("err","连接失败")});
}

if(configured){
  onAuthStateChanged(auth,user=>{
    if(user){
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      startCloudSync(user);
    }else{
      document.getElementById("app").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }
  });
}

document.getElementById("loginBtn").onclick=async()=>{
  if(!configured)return;
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const err=document.getElementById("loginError"); err.textContent="";
  try{await signInWithEmailAndPassword(auth,email,password)}catch(e){err.textContent="登录失败，请检查邮箱或密码。"}
};
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click()});
document.getElementById("logoutBtn").onclick=()=>signOut(auth);

function renderTabs(){
  const dates=getCurrentWeekDates(), today=new Date();
  document.getElementById("mobileTabs").innerHTML=DAYS.map(d=>`<button class="btn ${sameDay(dates[d],today)?"today-tab":""}" data-tab="${d}">${d} ${fmt(dates[d])}${sameDay(dates[d],today)?" · 今天":""}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activeDay=b.dataset.tab;renderTabs();renderWeek()});
}
function renderWeek(){
  const dates=getCurrentWeekDates(),today=new Date(),root=document.getElementById("week");
  root.innerHTML=DAYS.map(day=>{
    const items=(menu[day]||[]).map((name,index)=>`<div class="item ${cls(dishes[name]?.type)}" draggable="true" data-day="${day}" data-index="${index}" data-name="${esc(name)}">${esc(name)}<button class="x" data-remove-day="${day}" data-remove-index="${index}">×</button></div>`).join("");
    const isToday=sameDay(dates[day],today);
    return `<section class="day ${day===activeDay?"active-day":""} ${isToday?"today":""}" data-day="${day}"><div class="day-head"><div class="day-meta"><span class="day-name" data-select-day="${day}">${day} ${isToday?'<span class="today-badge">今天</span>':""}</span><span class="day-date">${fmt(dates[day])}</span></div><span class="day-count">${(menu[day]||[]).length} 道</span></div><div class="items">${items||'<div class="hint" style="padding-top:35px;text-align:center">还没有安排</div>'}</div></section>`;
  }).join("");
  document.querySelectorAll("[data-select-day]").forEach(e=>e.onclick=()=>{activeDay=e.dataset.selectDay;renderTabs();renderWeek()});
  document.querySelectorAll(".x").forEach(b=>b.onclick=e=>{e.stopPropagation();menu[b.dataset.removeDay].splice(Number(b.dataset.removeIndex),1);renderWeek();renderIngredients();saveCloud()});
  document.querySelectorAll(".item").forEach(el=>el.addEventListener("dragstart",e=>{dragPayload={source:"menu",day:el.dataset.day,index:Number(el.dataset.index),name:el.dataset.name};e.dataTransfer.effectAllowed="move"}));
  document.querySelectorAll(".day").forEach(day=>{
    day.addEventListener("dragover",e=>{e.preventDefault();day.classList.add("dragover")});
    day.addEventListener("dragleave",()=>day.classList.remove("dragover"));
    day.addEventListener("drop",e=>{
      e.preventDefault();day.classList.remove("dragover");if(!dragPayload)return;
      const target=day.dataset.day;
      if(dragPayload.source==="library")menu[target].push(dragPayload.name);
      else{const [moved]=menu[dragPayload.day].splice(dragPayload.index,1);menu[target].push(moved)}
      activeDay=target;dragPayload=null;renderAll();saveCloud();
    });
  });
}
function addToActive(name){menu[activeDay].push(name);renderWeek();renderIngredients();saveCloud();toast(name+" → "+activeDay)}
function renderLibrary(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const entries=Object.entries(dishes).filter(([n,d])=>(n+" "+(d.ingredients||[]).join(" ")).toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0],"zh"));
  const groups={"主菜":entries.filter(([,d])=>d.type==="主菜"),"配菜":entries.filter(([,d])=>d.type==="配菜"),"汤/炖菜":entries.filter(([,d])=>d.type==="汤/炖菜")};
  document.getElementById("mainCount").textContent=groups["主菜"].length+" 道";document.getElementById("sideCount").textContent=groups["配菜"].length+" 道";document.getElementById("soupCount").textContent=groups["汤/炖菜"].length+" 道";
  const fill=(id,arr)=>document.getElementById(id).innerHTML=arr.map(([n,d])=>`<div class="dish-chip ${cls(d.type)}" draggable="true" data-dish="${esc(n)}"><span class="dish-chip-label">${esc(n)}</span><button class="dish-delete" data-delete-dish="${esc(n)}">×</button></div>`).join("");
  fill("mainBank",groups["主菜"]);fill("sideBank",groups["配菜"]);fill("soupBank",groups["汤/炖菜"]);
  document.querySelectorAll("[data-dish]").forEach(el=>{
    el.addEventListener("dragstart",e=>{if(libraryEditMode){e.preventDefault();return}dragPayload={source:"library",name:el.dataset.dish};e.dataTransfer.effectAllowed="copy"});
    el.querySelector(".dish-chip-label").onclick=()=>{if(!libraryEditMode&&window.matchMedia("(max-width:760px)").matches)addToActive(el.dataset.dish)};
  });
  document.querySelectorAll("[data-delete-dish]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();const n=b.dataset.deleteDish;if(!confirm(`从共享菜库删除“${n}”？`))return;
    delete dishes[n];deletedDishes.add(n);DAYS.forEach(d=>menu[d]=(menu[d]||[]).filter(x=>x!==n));renderAll();saveCloud();
  });
}
function setEdit(on){libraryEditMode=on;document.body.classList.toggle("edit-library",on);const b=document.getElementById("toggleEditLibrary");b.textContent=on?"完成编辑":"开始编辑菜库";b.classList.toggle("primary",on)}
document.getElementById("toggleEditLibrary").onclick=()=>setEdit(!libraryEditMode);
document.getElementById("search").oninput=renderLibrary;
document.getElementById("addDish").onclick=()=>{
  const name=document.getElementById("newName").value.trim(),type=document.getElementById("newType").value,ingredients=document.getElementById("newIngredients").value.split(/[，,]/).map(s=>s.trim()).filter(Boolean);
  if(!name)return toast("请先输入菜名");dishes[name]={type,ingredients};deletedDishes.delete(name);document.getElementById("newName").value="";document.getElementById("newIngredients").value="";renderLibrary();saveCloud();
};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function generate(days){let mains=shuffle(Object.keys(dishes).filter(n=>dishes[n].type==="主菜")),sides=shuffle(Object.keys(dishes).filter(n=>dishes[n].type==="配菜")),mi=0,si=0;days.forEach(day=>{if(mi+1>=mains.length){mains=shuffle(mains);mi=0}if(si>=sides.length){sides=shuffle(sides);si=0}menu[day]=[mains[mi++],mains[mi++],sides[si++]]});renderAll();saveCloud()}
document.getElementById("auto5").onclick=()=>generate(DAYS.slice(0,5));document.getElementById("auto7").onclick=()=>generate(DAYS);
document.getElementById("clearMenu").onclick=()=>{if(!confirm("清空整周菜单？"))return;DAYS.forEach(d=>menu[d]=[]);renderAll();saveCloud()};

function renderScope(){document.getElementById("scope").innerHTML=["全周",...DAYS].map(s=>`<button class="btn ${s===scope?"active":""}" data-scope="${s}">${s}</button>`).join("");document.querySelectorAll("[data-scope]").forEach(b=>b.onclick=()=>{scope=b.dataset.scope;renderScope();renderIngredients()})}
function selectedDishes(){return scope==="全周"?DAYS.flatMap(d=>menu[d]||[]):menu[scope]||[]}
function ingredientGroups(){const protein=new Set(),veg=new Set(),aux=new Set();selectedDishes().forEach(n=>(dishes[n]?.ingredients||[]).forEach(i=>{if(AUXILIARY_INGREDIENTS.has(i))aux.add(i);else if(PROTEIN_INGREDIENTS.has(i))protein.add(i);else veg.add(i)}));return{protein:[...protein].sort((a,b)=>a.localeCompare(b,"zh")),veg:[...veg].sort((a,b)=>a.localeCompare(b,"zh")),aux:[...aux].sort((a,b)=>a.localeCompare(b,"zh"))}}
function renderIngredients(){const g=ingredientGroups(),fill=(id,a,c="")=>document.getElementById(id).innerHTML=a.length?a.map(x=>`<span class="ing ${c}">${esc(x)}</span>`).join(""):'<span class="hint">暂无</span>';fill("proteinIngredientList",g.protein);fill("vegIngredientList",g.veg);fill("auxIngredientList",g.aux,"aux")}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch{prompt("复制下面内容：",t)}}
document.getElementById("copyIngredients").onclick=()=>{const g=ingredientGroups();copyText(`${scope}采购清单\n\n荤菜原料：\n${g.protein.join("、")||"无"}\n\n蔬菜 / 豆制品：\n${g.veg.join("、")||"无"}\n\n辅料：\n${g.aux.join("、")||"无"}`,"采购清单已复制")};
document.getElementById("copyMenu").onclick=()=>copyText(DAYS.map(d=>`${d}：${(menu[d]||[]).join("、")||"未安排"}`).join("\n"),"菜单已复制");
function renderAll(){renderTabs();renderLibrary();renderWeek();renderScope();renderIngredients()}
</script>
</body>
</html>
